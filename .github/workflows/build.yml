name: Build APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon --stacktrace :phone:assembleDebug :tv:assembleDebug
      - name: Collect APKs
        run: |
          mkdir out
          cp phone/build/outputs/apk/debug/phone-debug.apk out/NotifyTV-phone.apk
          cp tv/build/outputs/apk/debug/tv-debug.apk out/NotifyTV-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotifyTV-apks
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NotifyTV build ${{ github.run_number }}
          files: out/*.apk
